<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Starjourn — Map Generator</title>

<style>
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    background: #000;
    color: #ddd;
    font-family: system-ui, Arial, sans-serif;
    overflow: hidden;
}

.app {
    display: flex;
    width: 100%;
    height: 100%;
}

.sidebar {
    box-sizing: border-box;
    width: 200px;
    min-width: 230px;
    height: 100%;
    padding: 12px;
    background: #081018;
    box-shadow: 2px 0 8px rgba(0,0,0,.6);
    overflow-y: auto;
    z-index: 10;
}

.sidebar h3 {
    margin: 4px 0 16px;
    font-size: 16px;
    line-height: 1.25;
}

.control {
    margin-bottom: 12px;
}

label {
    display: block;
    margin: 7px 0;
    font-size: 13px;
}

input[type="number"],
input[type="text"],
select {
    box-sizing: border-box;
    width: 100%;
}

input[type="number"] {
    background: #101820;
    color: #fff;
    border: 1px solid #34414b;
    border-radius: 3px;
    padding: 5px;
}

input[type="range"] {
    width: 100%;
}

input[type="checkbox"] {
    vertical-align: middle;
}

.row {
    display: flex;
    gap: 8px;
}

.muted {
    color: #9aa;
    font-size: 10px;
}

button {
    padding: 7px 12px;
    margin-right: 4px;
    border: 1px solid #45535e;
    border-radius: 4px;
    background: #18232c;
    color: #fff;
    cursor: pointer;
}

button:hover {
    background: #263540;
}

.main {
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    box-sizing: border-box;
    overflow: hidden;
}

.boardFrame {
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

#canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #000;
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <h3>Starjourn Map Generator</h3>

        <div class="control">
            <label>
                Planet Count
                <small class="muted">(cells)</small>
            </label>

            <input
                id="count"
                type="number"
                value="35"
                min="1"
            >
        </div>

        <div class="control">
            <label>Columns (0 = auto)</label>

            <input
                id="cols"
                type="number"
                value="7"
                min="0"
            >
        </div>

        <div class="control" style="display:none;">
            <div class="row">

                <div style="flex:1;">
                    <label>Canvas Scale %</label>
                    <input
                        id="scale"
                        type="number"
                        value="100"
                        min="10"
                    >
                </div>

                <div style="width:80px;">
                    <label>Runs</label>
                    <input
                        id="runs"
                        type="number"
                        value="1"
                        min="1"
                    >
                </div>

            </div>
        </div>

        <div class="control">

            <label>
                <input
                    id="doGrid"
                    type="checkbox"
                    checked
                >
                Stat Grid Overlay
            </label>

            <label>
                <input
                    id="doBG"
                    type="checkbox"
                    checked
                >
                Background
            </label>

        </div>

        <div class="control">

            <strong>Planet Features</strong>

            <label>
                <input id="land" type="checkbox" checked>
                Land
            </label>

            <label>
                <input id="city" type="checkbox" checked>
                Cities
            </label>

            <label>
                <input id="poles" type="checkbox" checked>
                Glacial Caps
            </label>

            <label>
                <input id="mountains" type="checkbox" checked>
                Mountains
            </label>

            <label>
                <input id="clouds" type="checkbox" checked>
                Clouds
            </label>

            <label>
                <input id="moons" type="checkbox" checked>
                Moons
            </label>

            <label>
                <input id="asteroids" type="checkbox" checked>
                Asteroids
            </label>

            <label>
                <input id="rings" type="checkbox" checked>
                Rings
            </label>

            <label>
                <input id="shadow" type="checkbox" checked>
                Darkside Shadow
            </label>

        </div>

        <div class="control">

            <strong>Environment</strong>

            <label>
                <input id="doStars" type="checkbox" checked>
                Starfield
            </label>

            <label>
                Stars
                <input
                    id="starCount"
                    type="range"
                    min="200"
                    max="7600"
                    value="1200"
                >
                <span id="starLabel">1200</span>
            </label>

            <label>
                <input id="doFields" type="checkbox" checked>
                Asteroid Fields
            </label>

            <label>
                <input id="doNebula" type="checkbox" checked>
                Nebulas
            </label>

            <label>
                <input id="doGas" type="checkbox" checked>
                Gas Giants
            </label>

            <label>
                <input id="doBlackHoles" type="checkbox" checked>
                Black Holes
            </label>

        </div>

        <div style="margin-top:12px;">

            <button id="generate">
                Generate
            </button>

            <button id="export">
                Export SVG
            </button>

        </div>

        <p class="muted">
            Starjourn Generator HTML version 1.3.6<br>
            Copyright SPM 2026 - All Rights Reserved
        </p>

    </aside>


    <main class="main">

        <div class="boardFrame">
            <svg
                id="canvas"
                xmlns="http://www.w3.org/2000/svg"
                preserveAspectRatio="xMidYMid meet"
            ></svg>
        </div>

    </main>

</div>


<script>

const SVG_NS = "http://www.w3.org/2000/svg";

const canvas = document.getElementById("canvas");

const CELL_SIZE = 420;
const MAP_ORIGIN = 150;


/* reandom nums */

function rand(min, max) {
    return min + Math.random() * (max - min);
}

function randInt(min, max) {
    return Math.floor(rand(min, max + 1));
}


/* svg helpers */

function createSVG(tag, attrs = {}) {

    const el = document.createElementNS(SVG_NS, tag);

    for (const key in attrs) {
        el.setAttribute(key, attrs[key]);
    }

    return el;
}


function clearSVG() {

    while (canvas.firstChild) {
        canvas.removeChild(canvas.firstChild);
    }
}


function color(r, g, b) {

    return `rgb(
        ${Math.round(r)},
        ${Math.round(g)},
        ${Math.round(b)}
    )`;
}


function ensureDefs() {

    let defs = canvas.querySelector("defs");

    if (!defs) {
        defs = createSVG("defs");
        canvas.insertBefore(defs, canvas.firstChild);
    }

    return defs;
}


/* polygon system */

function polygonPoints(cx, cy, r, sides, jitter) {

    const points = [];

    for (let i = 0; i < sides; i++) {

        const angle =
            Math.PI * 2 / sides * i;

        const radius =
            r * (
                1 +
                (
                    jitter
                        ? Math.random() * jitter - jitter / 2
                        : 0
                )
            );

        const x =
            cx + Math.cos(angle) * radius;

        const y =
            cy + Math.sin(angle) * radius;

        points.push(`${x},${y}`);
    }

    return points.join(" ");
}


function createPolygon(parent, cx, cy, r, sides) {

    const polygon = createSVG("polygon", {
        points: polygonPoints(
            cx,
            cy,
            r,
            sides,
            0.25
        )
    });

    parent.appendChild(polygon);

    return polygon;
}


function createStar(parent, x, y, outerR, fill) {

    const innerR = outerR * 0.45;

    const points = [];

    for (let i = 0; i < 5; i++) {

        const angle =
            -Math.PI / 2 +
            i * (Math.PI * 2 / 5);

        const ox =
            x + Math.cos(angle) * outerR;

        const oy =
            y + Math.sin(angle) * outerR;

        points.push(`${ox},${oy}`);

        const innerAngle =
            angle + Math.PI / 5;

        const ix =
            x + Math.cos(innerAngle) * innerR;

        const iy =
            y + Math.sin(innerAngle) * innerR;

        points.push(`${ix},${iy}`);
    }

    const star = createSVG("polygon", {
        points: points.join(" "),
        fill: fill,
        stroke: "none"
    });

    parent.appendChild(star);

    return star;
}


/* palette engine */

const PALETTES = [

    {base:[70,140,220], land:[90,200,150]},
    {base:[220,170,90], land:[200,120,70]},
    {base:[100,190,190], land:[155,175,90]},
    {base:[120,227,227], land:[145,255,80]},
    {base:[200,80,80], land:[255,130,40]},
    {base:[190,30,35], land:[190,125,100]},
    {base:[230,230,127], land:[255,200,60]},
    {base:[60,115,190], land:[205,220,60]},
    {base:[25,15,190], land:[70,140,65]},
    {base:[130,205,130], land:[130,135,95]},
    {base:[240,80,35], land:[175,125,55]},
    {base:[255,255,255], land:[200,200,160]},
    {base:[180,220,255], land:[255,255,255]},
    {base:[180,220,180], land:[255,245,165]},
    {base:[70,90,115], land:[126,145,90]},
    {base:[125,70,90], land:[175,70,100]},
    {base:[80,80,180], land:[190,220,145]},
    {base:[130,140,100], land:[150,100,60]},
    {base:[170,190,210], land:[100,150,172]},
    {base:[50,100,80], land:[200,230,100]},
    {base:[10,60,60], land:[90,205,120]},
    {base:[110,70,150], land:[240,160,220]},
    {base:[140,100,70], land:[210,200,180]},
    {base:[45,160,130], land:[165,135,190]},
    {base:[90,160,180], land:[190,130,80]},
    {base:[255,160,90], land:[255,215,75]}

];


/* shadow gradient */

const SHADOW_OFFSET = 0;


function makeShadowGradient(id, rotation) {

    const defs = ensureDefs();

    const gradient = createSVG("linearGradient", {
        id: id,
        x1: "0%",
        y1: "0%",
        x2: "100%",
        y2: "0%"
    });

    gradient.setAttribute(
        "gradientTransform",
        `rotate(${rotation})`
    );

    gradient.appendChild(
        createSVG("stop", {
            offset: "0%",
            "stop-color": "#000",
            "stop-opacity": "0"
        })
    );

    gradient.appendChild(
        createSVG("stop", {
            offset: "100%",
            "stop-color": "#000",
            "stop-opacity": "1"
        })
    );

    defs.appendChild(gradient);

    return gradient;
}


function applyDarkside(
    parent,
    cx,
    cy,
    r,
    rotation = 28,
    opacity = 0.88
) {

    const id =
        "shadow_" +
        Math.random().toString(36).slice(2);

    makeShadowGradient(id, rotation);

    const shadow = createSVG("ellipse", {
        cx: cx - r * SHADOW_OFFSET,
        cy: cy,
        rx: r,
        ry: r,
        fill: `url(#${id})`,
        opacity: opacity
    });

    parent.appendChild(shadow);

    return shadow;
}


/* main planet creation */

function createPlanet(parent, cx, cy, r, opts) {

    const group = createSVG("g");

    parent.appendChild(group);

    let hasCity = false;
    let cityRating = 0;

    const palette =
        PALETTES[
            randInt(0, PALETTES.length - 1)
        ];

    const baseColor =
        color(
            palette.base[0],
            palette.base[1],
            palette.base[2]
        );

    const base = createSVG("circle", {
        cx: cx,
        cy: cy,
        r: r,
        fill: baseColor
    });

    group.appendChild(base);


    /* land */

    const landZones = [];

    if (opts.land) {

        const landGroup = createSVG("g");

        group.appendChild(landGroup);

        const baseCount =
            randInt(4, 10);

        for (let i = 0; i < baseCount; i++) {

            const px =
                cx + rand(-r * 0.32, r * 0.32);

            const py =
                cy + rand(-r * 0.32, r * 0.32);

            const pr =
                rand(r * 0.08, r * 0.5);

            landZones.push({
                x: px,
                y: py,
                r: pr
            });

            const landR =
                Math.min(
                    255,
                    Math.max(
                        0,
                        palette.land[0] +
                        rand(-30, 30)
                    )
                );

            const landG =
                Math.min(
                    255,
                    Math.max(
                        0,
                        palette.land[1] +
                        rand(-30, 30)
                    )
                );

            const landB =
                Math.min(
                    255,
                    Math.max(
                        0,
                        palette.land[2] +
                        rand(-30, 30)
                    )
                );

            const land = createSVG("polygon", {
                points: polygonPoints(
                    px,
                    py,
                    pr,
                    randInt(4, 6),
                    0.45
                ),
                fill: color(
                    landR,
                    landG,
                    landB
                )
            });

            landGroup.appendChild(land);
        }
    }


    /* mountains */

    if (
        opts.mountains &&
        landZones.length
    ) {

        const mountains =
            createSVG("g");

        group.appendChild(mountains);

        const mountainCount =
            randInt(10, 20);

        for (
            let i = 0;
            i < mountainCount;
            i++
        ) {

            const zone =
                landZones[
                    randInt(
                        0,
                        landZones.length - 1
                    )
                ];

            const tx =
                zone.x +
                rand(
                    -zone.r * 0.8,
                    zone.r * 0.8
                );

            const ty =
                zone.y +
                rand(
                    -zone.r * 0.8,
                    zone.r * 0.8
                );

            if (
                Math.hypot(
                    tx - zone.x,
                    ty - zone.y
                ) < zone.r * 0.9
            ) {

                const mountain =
                    createSVG("polygon", {
                        points: polygonPoints(
                            tx,
                            ty,
                            rand(2, 12),
                            3,
                            0.1
                        ),
                        fill: "#333",
                        opacity: 0.5
                    });

                mountain.setAttribute(
                    "transform",
                    `rotate(18 ${tx} ${ty})`
                );

                mountains.appendChild(
                    mountain
                );
            }
        }
    }


    /* -----------------------------
       CLOUDS
    ----------------------------- */

    if (opts.clouds) {

        const clouds =
            createSVG("g");

        group.appendChild(clouds);

        for (
            let i = 0;
            i < randInt(0, 12);
            i++
        ) {

            const w =
                rand(20, 60);

            const h =
                rand(8, 28);

            const cloud =
                createSVG("ellipse", {
                    cx:
                        cx +
                        rand(-r * 0.3, r * 0.3),

                    cy:
                        cy +
                        rand(-r * 0.65, r * 0.65),

                    rx: w,
                    ry: h,

                    fill: "#fff",

                    opacity:
                        rand(0.08, 0.22)
                });

            clouds.appendChild(cloud);
        }
    }


    /* glacial polar caps */

    if (
        opts.poles &&
        Math.random() < 0.6666667
    ) {

        const poleGroup =
            createSVG("g");

        const poleContent =
            createSVG("g");

        poleGroup.appendChild(
            poleContent
        );

        const defs =
            ensureDefs();

        if (!defs.querySelector("#roughen")) {

            const filter =
                createSVG("filter", {
                    id: "roughen",
                    x: "-50%",
                    y: "-50%",
                    width: "200%",
                    height: "200%"
                });

            filter.appendChild(
                createSVG("feTurbulence", {
                    type: "fractalNoise",
                    baseFrequency: "0.8",
                    numOctaves: "2",
                    seed:
                        Math.floor(
                            Math.random() * 1000
                        )
                })
            );

            filter.appendChild(
                createSVG(
                    "feDisplacementMap",
                    {
                        in: "SourceGraphic",
                        scale: "4",
                        xChannelSelector: "R",
                        yChannelSelector: "G"
                    }
                )
            );

            defs.appendChild(filter);
        }


        function addPole(centerY) {

            const poleRadius =
                r * rand(0.22, 0.55);

            const basePole =
                createPolygon(
                    poleContent,
                    cx,
                    centerY,
                    poleRadius,
                    randInt(5, 10)
                );

            basePole.setAttribute(
                "fill",
                "#fff"
            );

            basePole.setAttribute(
                "stroke",
                "none"
            );

            const sy =
                rand(0.55, 0.65);

            basePole.setAttribute(
                "transform",
                `translate(${cx} ${centerY})
                 scale(1 ${sy})
                 translate(${-cx} ${-centerY})`
            );

            basePole.setAttribute(
                "filter",
                "url(#roughen)"
            );


            for (
                let i = 0;
                i < randInt(2, 5);
                i++
            ) {

                const detail =
                    createPolygon(
                        poleContent,

                        cx +
                        rand(
                            -poleRadius * 0.2,
                            poleRadius * 0.2
                        ),

                        centerY +
                        rand(
                            -poleRadius * 0.1,
                            poleRadius * 0.1
                        ),

                        poleRadius *
                        rand(0.4, 0.7),

                        randInt(6, 10)
                    );

                detail.setAttribute(
                    "fill",
                    color(
                        rand(220, 240),
                        rand(235, 250),
                        255
                    )
                );

                detail.setAttribute(
                    "stroke",
                    "none"
                );

                const sy2 =
                    rand(0.55, 0.75);

                const rot =
                    rand(-6, 6);

                detail.setAttribute(
                    "transform",
                    `translate(${cx} ${centerY})
                     rotate(${rot})
                     scale(1 ${sy2})
                     translate(${-cx} ${-centerY})`
                );

                detail.setAttribute(
                    "filter",
                    "url(#roughen)"
                );

                detail.setAttribute(
                    "opacity",
                    rand(0.8, 1)
                );
            }
        }


        const poleOffset =
            r * 0.975;

        addPole(
            cy + poleOffset
        );

        addPole(
            cy -
            poleOffset * 1.052
        );


        poleContent.setAttribute(
            "transform",
            `rotate(-28 ${cx} ${cy})`
        );


        const clipId =
            "poleclip_" +
            Math.random()
                .toString(36)
                .slice(2);

        const clip =
            createSVG("clipPath", {
                id: clipId
            });

        clip.appendChild(
            createSVG("circle", {
                cx: cx,
                cy: cy,
                r: r
            })
        );

        defs.appendChild(clip);

        poleGroup.setAttribute(
            "clip-path",
            `url(#${clipId})`
        );

        group.appendChild(
            poleGroup
        );
    }


    /* -darkside shadow */

    if (opts.shadow) {

        applyDarkside(
            group,
            cx,
            cy,
            r * 1.02,
            28,
            0.88
        );
    }


    /* ringss */

    if (
        opts.rings &&
        Math.random() < 0.4
    ) {

        const ringsBack =
            createSVG("g");

        const shift = 5;

        const ringR =
            Math.min(
                255,
                palette.land[0] + shift
            );

        const ringG =
            Math.min(
                255,
                palette.land[1] + shift
            );

        const ringB =
            Math.min(
                255,
                palette.land[2] + shift
            );

        const gradientName =
            `RingFade_${ringR}_${ringG}_${ringB}`;

        const defs =
            ensureDefs();

        if (
            !defs.querySelector(
                "#" + gradientName
            )
        ) {

            const gradient =
                createSVG(
                    "linearGradient",
                    {
                        id:
                            gradientName,

                        x1: "0%",
                        y1: "0%",
                        x2: "100%",
                        y2: "0%"
                    }
                );

            gradient.appendChild(
                createSVG("stop", {
                    offset: "0%",
                    "stop-color":
                        color(
                            ringR,
                            ringG,
                            ringB
                        )
                })
            );

            gradient.appendChild(
                createSVG("stop", {
                    offset: "100%",
                    "stop-color":
                        color(
                            ringR,
                            ringG,
                            ringB
                        )
                })
            );

            defs.appendChild(
                gradient
            );
        }


        const rotation =
            rand(40, 60);

        let maxRx = 0;
        let maxRy = 0;

        const ringCount =
            randInt(2, 5);

        for (
            let i = 0;
            i < ringCount;
            i++
        ) {

            const step =
                i * 0.2;

            const rx =
                r * (0.35 + step);

            const ry =
                r * (1.6 + step);

            maxRx =
                Math.max(maxRx, rx);

            maxRy =
                Math.max(maxRy, ry);

            const ring =
                createSVG("ellipse", {
                    cx: cx,
                    cy: cy,
                    rx: rx,
                    ry: ry,

                    fill: "none",

                    stroke:
                        `url(#${gradientName})`,

                    "stroke-width":
                        rand(0.55, 8.5),

                    opacity: 1
                });

            ringsBack.appendChild(
                ring
            );
        }


        ringsBack.setAttribute(
            "transform",
            `rotate(
                ${rotation}
                ${cx}
                ${cy}
            )`
        );

        group.insertBefore(
            ringsBack,
            base
        );


        const ringsFront =
            ringsBack.cloneNode(true);

        const clipId =
            "ringclip_" +
            Math.random()
                .toString(36)
                .slice(2);

        const clip =
            createSVG("clipPath", {
                id: clipId
            });

        const groupWidth =
            maxRx * 6;

        const groupHeight =
            maxRy * 1.5;

        const rect =
            createSVG("rect", {
                x:
                    cx -
                    groupWidth / 2,

                y: cy,

                width:
                    groupWidth,

                height:
                    groupHeight / 2
            });

        rect.setAttribute(
            "transform",
            `rotate(
                ${rotation + 220}
                ${cx}
                ${cy}
            )`
        );

        clip.appendChild(rect);

        defs.appendChild(clip);

        ringsFront.setAttribute(
            "clip-path",
            `url(#${clipId})`
        );

        ringsFront.setAttribute(
            "transform",
            `rotate(
                ${rotation}
                ${cx}
                ${cy}
            )`
        );

        group.appendChild(
            ringsFront
        );
    }


    /* da moons */

    if (opts.moons) {

        const moons =
            createSVG("g");

        group.appendChild(moons);

        const inherit =
            rand(0.55, 0.86);

        const moonCount =
            randInt(0, 4);

        for (
            let i = 0;
            i < moonCount;
            i++
        ) {

            const angle =
                rand(
                    0,
                    Math.PI * 2
                );

            const distance =
                r + rand(40, 100);

            const mx =
                cx +
                Math.cos(angle) *
                distance;

            const my =
                cy +
                Math.sin(angle) *
                distance;

            const mr =
                rand(6, 15);

            const gray =
                randInt(150, 240);

            const rCol =
                Math.min(
                    255,
                    gray * (1 - inherit) +
                    palette.land[0] * inherit
                );

            const gCol =
                Math.min(
                    255,
                    gray * (1 - inherit) +
                    palette.land[1] * inherit
                );

            const bCol =
                Math.min(
                    255,
                    gray * (1 - inherit) +
                    palette.land[2] * inherit
                );

            const moon =
                createSVG("circle", {
                    cx: mx,
                    cy: my,
                    r: mr,
                    fill:
                        color(
                            rCol,
                            gCol,
                            bCol
                        )
                });

            moons.appendChild(moon);

            if (opts.shadow) {

                applyDarkside(
                    moons,
                    mx,
                    my,
                    mr,
                    28,
                    0.88
                );
            }
        }
    }


    /* planets asteroids */

    if (opts.asteroids) {

        const asteroidGroup =
            createSVG("g");

        group.appendChild(
            asteroidGroup
        );

        const count =
            randInt(0, 28);

        for (
            let i = 0;
            i < count;
            i++
        ) {

            const angle =
                rand(
                    0,
                    Math.PI * 2
                );

            const distance =
                r + rand(30, 120);

            const ax =
                cx +
                Math.cos(angle) *
                distance;

            const ay =
                cy +
                Math.sin(angle) *
                distance;

            const rock =
                createPolygon(
                    asteroidGroup,
                    ax,
                    ay,
                    rand(2, 8),
                    randInt(4, 7)
                );

            const gray =
                randInt(80, 180);

            rock.setAttribute(
                "fill",
                color(gray, gray, gray)
            );

            rock.setAttribute(
                "opacity",
                rand(0.6, 1)
            );
        }
    }


    /* cities */

    if (
        opts.city &&
        landZones.length &&
        Math.random() < 0.6
    ) {

        if (Math.random() <= 0.50) {

            const cityGroup =
                createSVG("g");

            group.appendChild(
                cityGroup
            );

            const clusterCount =
                randInt(1, 3);

            for (
                let c = 0;
                c < clusterCount;
                c++
            ) {

                const zone =
                    landZones[
                        randInt(
                            0,
                            landZones.length - 1
                        )
                    ];

                const dotsInCluster =
                    randInt(2, 5);

                const safeRadius =
                    Math.max(
                        0,
                        zone.r - 3.4
                    );

                for (
                    let i = 0;
                    i < dotsInCluster;
                    i++
                ) {

                    const ox =
                        zone.x +
                        rand(
                            -safeRadius,
                            safeRadius
                        );

                    const oy =
                        zone.y +
                        rand(
                            -safeRadius,
                            safeRadius
                        );

                    const d =
                        rand(1.5, 3);

                    const tintRoll =
                        Math.random();

                    let rL = 255;
                    let gL = 255;
                    let bL = 255;

                    if (
                        tintRoll < 0.25
                    ) {

                        gL =
                            rand(180, 210);

                        bL =
                            rand(50, 100);

                    } else if (
                        tintRoll > 0.75
                    ) {

                        rL =
                            rand(180, 190);

                        gL =
                            rand(230, 245);
                    }

                    const dot =
                        createSVG("circle", {
                            cx: ox,
                            cy: oy,
                            r: d,
                            fill:
                                color(
                                    rL,
                                    gL,
                                    bL
                                ),
                            opacity:
                                rand(
                                    0.35,
                                    0.75
                                )
                        });

                    cityGroup.appendChild(dot);
                }
            }

            hasCity = true;

            cityRating =
                randInt(1, 3);
        }
    }


    return {
        group: group,
        hasCity: hasCity,
        cityRating: cityRating
    };
}

/* create nebula */

function createNebula(
    parent,
    cx,
    cy,
    r
) {

    const group =
        createSVG("g");

    parent.appendChild(group);

    const baseR =
        randInt(120, 255);

    const baseG =
        randInt(50, 200);

    const baseB =
        randInt(120, 255);


    for (
        let layer = 0;
        layer < randInt(3, 6);
        layer++
    ) {

        const count =
            randInt(12, 25);

        for (
            let i = 0;
            i < count;
            i++
        ) {

            const angle =
                rand(
                    0,
                    Math.PI * 2
                );

            const distance =
                Math.pow(
                    Math.random(),
                    0.7
                ) *
                r *
                2.5;

            const x =
                cx +
                Math.cos(angle) *
                distance;

            const y =
                cy +
                Math.sin(angle) *
                distance;

            const w =
                rand(80, 200);

            const h =
                rand(60, 160);

            const nebula =
                createSVG("ellipse", {
                    cx: x,
                    cy: y,
                    rx: w,
                    ry: h,

                    fill:
                        color(
                            Math.min(
                                255,
                                baseR +
                                rand(-50, 50)
                            ),

                            Math.min(
                                255,
                                baseG +
                                rand(-50, 50)
                            ),

                            Math.min(
                                255,
                                baseB +
                                rand(-50, 50)
                            )
                        ),

                    opacity:
                        rand(
                            0.04,
                            0.12
                        )
                });

            nebula.setAttribute(
                "transform",
                `rotate(
                    ${rand(-30, 30)}
                    ${x}
                    ${y}
                )`
            );

            group.appendChild(
                nebula
            );
        }
    }


    const core =
        createSVG("circle", {
            cx: cx,
            cy: cy,

            r:
                r *
                rand(0.2, 0.9),

            fill:
                color(
                    Math.min(
                        255,
                        baseR + 60
                    ),

                    Math.min(
                        255,
                        baseG + 60
                    ),

                    Math.min(
                        255,
                        baseB + 60
                    )
                ),

            opacity:
                rand(0.01, 0.05)
        });

    group.appendChild(core);


    for (
        let i = 0;
        i < randInt(10, 45);
        i++
    ) {

        const size =
            rand(2, 6.5);

        const star =
            createSVG("circle", {
                cx:
                    cx +
                    rand(-r, r),

                cy:
                    cy +
                    rand(-r, r),

                r: size,

                fill:
                    color(
                        Math.min(
                            255,
                            baseR + 80
                        ),

                        Math.min(
                            255,
                            baseG + 80
                        ),

                        Math.min(
                            255,
                            baseB + 80
                        )
                    ),

                opacity:
                    rand(0.6, 1)
            });

        group.appendChild(star);
    }


    group.setAttribute(
        "opacity",
        rand(0.18, 0.36)
    );

    return group;
}


/* render black hole */

function createBlackHole(
    parent,
    cx,
    cy,
    r
) {

    const group =
        createSVG("g");

    parent.appendChild(group);


    const coreR =
        r * 0.55;


    for (
        let i = 0;
        i < 9;
        i++
    ) {

        const t =
            i / 9;

        const size =
            coreR *
            (1 + t * 0.5);

        const glow =
            createSVG("circle", {
                cx: cx,
                cy: cy,
                r: size,
                fill: "#111",
                opacity:
                    0.35 *
                    (1 - t)
            });

        group.appendChild(glow);
    }


    const strokeR =
        randInt(100, 255);

    const strokeG =
        randInt(100, 255);

    const strokeB =
        randInt(100, 255);


    const auraR =
        Math.min(
            255,
            strokeR + 60
        );

    const auraG =
        Math.min(
            255,
            strokeG + 60
        );

    const auraB =
        Math.min(
            255,
            strokeB + 60
        );


    const defs =
        ensureDefs();


    const auraId =
        "blackholeAura_" +
        Math.random()
            .toString(36)
            .slice(2);


    const gradient =
        createSVG(
            "radialGradient",
            {
                id: auraId,
                cx: "50%",
                cy: "50%",
                r: "50%"
            }
        );


    gradient.appendChild(
        createSVG("stop", {
            offset: "0%",
            "stop-color":
                color(
                    auraR,
                    auraG,
                    auraB
                ),
            "stop-opacity": "0.5"
        })
    );

    gradient.appendChild(
        createSVG("stop", {
            offset: "60%",
            "stop-color":
                color(
                    auraR,
                    auraG,
                    auraB
                ),
            "stop-opacity": "0.18"
        })
    );

    gradient.appendChild(
        createSVG("stop", {
            offset: "100%",
            "stop-color":
                color(
                    auraR,
                    auraG,
                    auraB
                ),
            "stop-opacity": "0"
        })
    );


    defs.appendChild(
        gradient
    );


    const auraRotation =
        rand(-42.5, 12.5);


    const aura1 =
        createSVG("ellipse", {
            cx: cx,
            cy: cy,
            rx: r * 2.6,
            ry: r * 1.3,
            fill:
                `url(#${auraId})`,
            opacity: 0.9
        });

    aura1.setAttribute(
        "transform",
        `rotate(
            ${auraRotation}
            ${cx}
            ${cy}
        )`
    );

    group.appendChild(aura1);


    const aura2 =
        createSVG("ellipse", {
            cx: cx,
            cy: cy,
            rx: r * 2.2,
            ry: r,
            fill:
                `url(#${auraId})`,
            opacity: 0.8
        });

    aura2.setAttribute(
        "transform",
        `rotate(
            ${90 + auraRotation}
            ${cx}
            ${cy}
        )`
    );

    group.appendChild(aura2);


    const core =
        createSVG("circle", {
            cx: cx,
            cy: cy,
            r: coreR,
            fill: "#000",
            stroke:
                color(
                    strokeR,
                    strokeG,
                    strokeB
                ),
            "stroke-width": 2.5
        });

    group.appendChild(core);


    return group;
}


/* render gas giant */

function createGasGiant(
    parent,
    cx,
    cy,
    r,
    opts
) {

    const group =
        createSVG("g");

    parent.appendChild(group);


    const radius =
        r * rand(1.61, 1.7);


    const palette =
        PALETTES[
            randInt(
                0,
                PALETTES.length - 1
            )
        ];


    const base =
        createSVG("circle", {
            cx: cx,
            cy: cy,
            r: radius,
            fill:
                color(
                    palette.base[0],
                    palette.base[1],
                    palette.base[2]
                )
        });

    group.appendChild(base);


    const defs =
        ensureDefs();


    const clipId =
        "gasClip_" +
        Math.random()
            .toString(36)
            .slice(2);


    const clip =
        createSVG("clipPath", {
            id: clipId
        });

    clip.appendChild(
        createSVG("circle", {
            cx: cx,
            cy: cy,
            r: radius
        })
    );

    defs.appendChild(clip);


    const bands =
        createSVG("g");

    bands.setAttribute(
        "clip-path",
        `url(#${clipId})`
    );


    const bandCount =
        randInt(24, 40);


    for (
        let i = 0;
        i < bandCount;
        i++
    ) {

        const t =
            i /
            (bandCount - 1);

        const latitude =
            (t - 0.5) * 2;

        const yOffset =
            Math.sin(
                latitude *
                Math.PI *
                0.5
            ) *
            radius;

        const h =
            rand(
                radius * 0.2,
                radius * 0.45
            );


        const mix =
            Math.random();

        let rC;
        let gC;
        let bC;


        if (mix < 0.33) {

            rC =
                palette.base[0] * 0.6;

            gC =
                palette.base[1] * 0.6;

            bC =
                palette.base[2] * 0.6;

        } else if (mix < 0.66) {

            rC =
                palette.base[0];

            gC =
                palette.base[1];

            bC =
                palette.base[2];

        } else {

            rC =
                (
                    palette.base[0] +
                    palette.land[0]
                ) * 0.5;

            gC =
                (
                    palette.base[1] +
                    palette.land[1]
                ) * 0.5;

            bC =
                (
                    palette.base[2] +
                    palette.land[2]
                ) * 0.5;
        }


        const band =
            createSVG("rect", {
                x:
                    cx - radius,

                y:
                    cy +
                    yOffset -
                    h / 2,

                width:
                    radius * 2,

                height: h,

                fill:
                    color(
                        rC,
                        gC,
                        bC
                    ),

                opacity:
                    rand(
                        0.25,
                        0.85
                    )
            });


        band.setAttribute(
            "transform",
            `rotate(
                ${rand(-2, 4)}
                ${cx}
                ${cy}
            )`
        );

        bands.appendChild(band);
    }


    /* storms */

    if (Math.random() < 0.6) {

        const stormCount =
            1 + randInt(1, 3);

        for (
            let i = 0;
            i < stormCount;
            i++
        ) {

            const width =
                radius *
                rand(0.25, 0.5);

            const height =
                width *
                rand(0.4, 0.7);

            const sx =
                cx +
                rand(
                    -radius * 0.4,
                    radius * 0.4
                );

            const sy =
                cy +
                rand(
                    -radius * 0.3,
                    radius * 0.3
                );


            const storm =
                createSVG("ellipse", {
                    cx: sx,
                    cy: sy,

                    rx:
                        width / 2,

                    ry:
                        height / 2,

                    fill:
                        color(
                            Math.min(
                                255,
                                palette.base[0] +
                                rand(60, 120)
                            ),

                            Math.min(
                                255,
                                palette.base[1] +
                                rand(-20, 60)
                            ),

                            Math.max(
                                0,
                                palette.base[2] -
                                rand(40, 80)
                            )
                        ),

                    opacity:
                        rand(0.5, 0.7)
                });

            bands.appendChild(storm);
        }
    }


    group.appendChild(bands);


    if (opts.shadow) {

        applyDarkside(
            group,
            cx,
            cy,
            radius,
            28,
            0.88
        );
    }


    return group;
}

) {

    ) {

/* cell stat rolls */

function addCellStats(
    parent,
    cols,
    rows,
    cellTypes,
    cellHasCity,
    cellCityRating
) {

    const startX =
        MAP_ORIGIN +
        CELL_SIZE * 0.5;

    const startY =
        MAP_ORIGIN +
        CELL_SIZE * 0.5;


    function plusRoll(type, hasCity) {

        if (type === "planet") {

            if (hasCity) {
                return randInt(1, 3);
            }

            return randInt(0, 3);
        }

        if (type === "asteroid") {
            return randInt(0, 1);
        }

        if (type === "nebula") {
            return 0;
        }

        if (type === "blackhole") {
            return 0;
        }

        if (type === "gasgiant") {
            return randInt(0, 1);
        }

        return randInt(0, 3);
    }


    function minusRoll(type, hasCity) {

        if (type === "planet") {
            return randInt(1, 3);
        }

        if (type === "asteroid") {
            return randInt(1, 3);
        }

        if (type === "nebula") {
            return randInt(1, 2);
        }

        if (type === "blackhole") {
            return randInt(4, 5);
        }

        if (type === "gasgiant") {
            return randInt(1, 3);
        }

        return randInt(1, 3);
    }


    for (
        let row = 0;
        row < rows;
        row++
    ) {

        for (
            let col = 0;
            col < cols;
            col++
        ) {

            const index =
                row * cols + col;


            const cx =
                startX +
                col * CELL_SIZE;

            const cy =
                startY +
                row * CELL_SIZE;


            const type =
                cellTypes[index] ||
                "planet";

            const hasCity =
                cellHasCity[index] ||
                false;


            let min;
            let max;


            if (type === "planet") {
                min = 3;
                max = 9;

            } else if (type === "asteroid") {
                min = 5;
                max = 11;

            } else if (type === "nebula") {
                min = 2;
                max = 7;

            } else if (type === "gasgiant") {
                min = 1;
                max = 11;

            } else if (type === "blackhole") {
                min = 1;
                max = 4;

            } else {
                min = 1;
                max = 10;
            }


            const pool = [];

            for (
                let n = min;
                n <= max;
                n++
            ) {
                pool.push(n);
            }


            for (
                let i = pool.length - 1;
                i > 0;
                i--
            ) {

                const j =
                    Math.floor(
                        Math.random() *
                        (i + 1)
                    );

                [
                    pool[i],
                    pool[j]
                ] = [
                    pool[j],
                    pool[i]
                ];
            }


            const rolls = [
                pool[0],
                pool[1],
                pool[2],
                pool[3]
            ];


            const fontSize = 48;


            /* top */

            const top =
                createSVG("text", {
                    x: cx,

                    y:
                        cy -
                        CELL_SIZE * 0.4125,

                    "text-anchor":
                        "middle",

                    "dominant-baseline":
                        "central",

                    "font-size":
                        fontSize,

                    "font-weight":
                        "bold",

                    fill: "#fff",

                    opacity: 0.73
                });

            top.textContent =
                rolls[0];

            parent.appendChild(top);


            /* bottom */

            const bottom =
                createSVG("text", {
                    x: cx,

                    y:
                        cy +
                        CELL_SIZE * 0.4125,

                    "text-anchor":
                        "middle",

                    "dominant-baseline":
                        "central",

                    "font-size":
                        fontSize,

                    "font-weight":
                        "bold",

                    fill: "#fff",

                    opacity: 0.73
                });

            bottom.textContent =
                rolls[1];

            parent.appendChild(bottom);


            /* left */

            const left =
                createSVG("text", {
                    x:
                        cx -
                        CELL_SIZE * 0.4125,

                    y: cy,

                    "text-anchor":
                        "middle",

                    "dominant-baseline":
                        "central",

                    "font-size":
                        fontSize,

                    "font-weight":
                        "bold",

                    fill: "#fff",

                    opacity: 0.73
                });

            left.textContent =
                rolls[2];

            parent.appendChild(left);


            /* right */

            const right =
                createSVG("text", {
                    x:
                        cx +
                        CELL_SIZE * 0.4125,

                    y: cy,

                    "text-anchor":
                        "middle",

                    "dominant-baseline":
                        "central",

                    "font-size":
                        fontSize,

                    "font-weight":
                        "bold",

                    fill: "#fff",

                    opacity: 0.73
                });

            right.textContent =
                rolls[3];

            parent.appendChild(right);


            /* plus */

            const plusX =
                cx -
                CELL_SIZE * 0.25;

            const plusY =
                cy -
                CELL_SIZE * 0.33;


            const plus =
                createSVG("text", {
                    x: plusX,
                    y: plusY,

                    "text-anchor":
                        "middle",

                    "dominant-baseline":
                        "central",

                    "font-size":
                        fontSize,

                    "font-weight":
                        "bold",

                    fill: "#00ffff",

                    opacity: 0.75
                });

            plus.textContent =
                "+" +
                plusRoll(
                    type,
                    hasCity
                );

            parent.appendChild(plus);


            /* minus */

            const minusX =
                cx +
                CELL_SIZE * 0.25;

            const minusY =
                cy +
                CELL_SIZE * 0.25;


            const minus =
                createSVG("text", {
                    x: minusX,
                    y: minusY,

                    "text-anchor":
                        "middle",

                    "dominant-baseline":
                        "central",

                    "font-size":
                        fontSize,

                    "font-weight":
                        "bold",

                    fill: "#daa520",

                    opacity: 0.75
                });

            minus.textContent =
                "-" +
                minusRoll(
                    type,
                    hasCity
                );

            parent.appendChild(minus);


            /* city stars */

            if (hasCity) {

                const rating =
                    cellCityRating[index] ||
                    1;

                const starX =
                    cx -
                    CELL_SIZE * 0.25;

                const starY =
                    cy -
                    CELL_SIZE * 0.23;

                const outer =
                    13;


                for (
                    let s = 0;
                    s < rating;
                    s++
                ) {

                    createStar(
                        parent,

                        starX -
                        s *
                        (outer * 2.2),

                        starY,

                        outer,

                        "#bffe3c"
                    );
                }
            }
        }
    }
}


/*settings, set defaults */

function getSettings() {

    return {

        count:
            Math.max(
                1,
                parseInt(
                    document.getElementById(
                        "count"
                    ).value,
                    10
                ) || 35
            ),

        columns:
            Math.max(
                0,
                parseInt(
                    document.getElementById(
                        "cols"
                    ).value,
                    10
                ) || 0
            ),

        scale:
            parseFloat(
                document.getElementById(
                    "scale"
                ).value
            ) || 100,


        doGrid:
            document.getElementById(
                "doGrid"
            ).checked,

        doBG:
            document.getElementById(
                "doBG"
            ).checked,


        land:
            document.getElementById(
                "land"
            ).checked,

        city:
            document.getElementById(
                "city"
            ).checked,

        poles:
            document.getElementById(
                "poles"
            ).checked,

        mountains:
            document.getElementById(
                "mountains"
            ).checked,

        clouds:
            document.getElementById(
                "clouds"
            ).checked,

        moons:
            document.getElementById(
                "moons"
            ).checked,

        asteroids:
            document.getElementById(
                "asteroids"
            ).checked,

        rings:
            document.getElementById(
                "rings"
            ).checked,

        shadow:
            document.getElementById(
                "shadow"
            ).checked,


        doStars:
            document.getElementById(
                "doStars"
            ).checked,

        starCount:
            parseInt(
                document.getElementById(
                    "starCount"
                ).value,
                10
            ) || 1200,

        doFields:
            document.getElementById(
                "doFields"
            ).checked,

        doNebula:
            document.getElementById(
                "doNebula"
            ).checked,

        doGas:
            document.getElementById(
                "doGas"
            ).checked,

        doBlackHoles:
            document.getElementById(
                "doBlackHoles"
            ).checked,


        /* type chances */

        nebula: 12,
        fields: 10,
        gas: 8,
        blackholes: 3
    };
}


//main run once

function runOnce(settings) {

    clearSVG();


    const spacing =
        CELL_SIZE;


    const cols =
        settings.columns > 0
            ? settings.columns
            : Math.ceil(
                Math.sqrt(
                    settings.count
                )
            );


    const rows =
        Math.ceil(
            settings.count /
            cols
        );


    const width =
        cols *
        spacing;

    const height =
        rows *
        spacing;




    canvas.setAttribute(
        "viewBox",
        `${MAP_ORIGIN}
         ${MAP_ORIGIN}
         ${width}
         ${height}`
    );


    canvas.setAttribute(
        "preserveAspectRatio",
        "xMidYMid meet"
    );


    ensureDefs();


    const mapClipId =
        "mapClip_" +
        Math.random()
            .toString(36)
            .slice(2);


    const mapClip =
        createSVG(
            "clipPath",
            {
                id: mapClipId
            }
        );


    mapClip.appendChild(
        createSVG("rect", {
            x: MAP_ORIGIN,
            y: MAP_ORIGIN,
            width: width,
            height: height
        })
    );


    ensureDefs().appendChild(
        mapClip
    );


    if (settings.doBG) {

        const background =
            createSVG("rect", {
                x: MAP_ORIGIN,
                y: MAP_ORIGIN,
                width: width,
                height: height,
                fill: "#000"
            });

        canvas.appendChild(
            background
        );
    }


    if (settings.doStars) {

        const stars =
            createSVG("g");

        stars.setAttribute(
            "clip-path",
            `url(#${mapClipId})`
        );

        canvas.appendChild(stars);


        for (
            let i = 0;
            i < settings.starCount;
            i++
        ) {

            const x =
                rand(
                    MAP_ORIGIN,
                    MAP_ORIGIN + width
                );

            const y =
                rand(
                    MAP_ORIGIN,
                    MAP_ORIGIN + height
                );

            const size =
                rand(0.5, 3);


            const star =
                createSVG("circle", {
                    cx: x,
                    cy: y,
                    r: size,
                    fill: "#fff",
                    opacity:
                        rand(0.6, 1)
                });

            stars.appendChild(star);
        }
    }


    const master =
        createSVG("g");

    master.setAttribute(
        "clip-path",
        `url(#${mapClipId})`
    );

    canvas.appendChild(master);


    const cellTypes = [];
    const cellHasCity = [];
    const cellCityRating = [];


    /* -------CELLS----------- */

    for (
        let i = 0;
        i < settings.count;
        i++
    ) {

        const col =
            i % cols;

        const row =
            Math.floor(
                i / cols
            );


        const cx =
            MAP_ORIGIN +
            col * spacing +
            spacing * 0.5;

        const cy =
            MAP_ORIGIN +
            row * spacing +
            spacing * 0.5;


        const roll =
            Math.random();


        let cumulative = 0;

        let object = null;

        let type =
            "planet";


        const nebulaChance =
            settings.nebula / 100;

        const fieldChance =
            settings.fields / 100;

        const gasChance =
            settings.gas / 100;

        const blackHoleChance =
            settings.blackholes / 100;


        /* nebula */

        if (
            settings.doNebula &&
            roll <
            (
                cumulative +=
                nebulaChance
            )
        ) {

            object =
                createNebula(
                    master,
                    cx,
                    cy,
                    rand(80, 140)
                );

            type = "nebula";

            cellHasCity.push(false);
            cellCityRating.push(0);
        }


        /* asteroid field */

        else if (
            settings.doFields &&
            roll <
            (
                cumulative +=
                fieldChance
            )
        ) {

            object =
                createAsteroidField(
                    master,
                    cx,
                    cy,
                    rand(60, 110)
                );

            type = "asteroid";

            cellHasCity.push(false);
            cellCityRating.push(0);
        }


        /* gas giant */

        else if (
            settings.doGas &&
            roll <
            (
                cumulative +=
                gasChance
            )
        ) {

            object =
                createGasGiant(
                    master,
                    cx,
                    cy,
                    rand(50, 90),
                    {
                        shadow:
                            settings.shadow
                    }
                );

            type = "gasgiant";

            cellHasCity.push(false);
            cellCityRating.push(0);
        }


        /* black hole */

        else if (
            settings.doBlackHoles &&
            roll <
            (
                cumulative +=
                blackHoleChance
            )
        ) {

            object =
                createBlackHole(
                    master,
                    cx,
                    cy,
                    rand(80, 160)
                );

            type = "blackhole";

            cellHasCity.push(false);
            cellCityRating.push(0);
        }


        /* create planet */

        else {

            const result =
                createPlanet(
                    master,
                    cx,
                    cy,
                    rand(50, 90),
                    settings
                );


            object =
                result.group;

            type =
                "planet";


            const hasCity =
                result.hasCity === true;


            cellHasCity.push(
                hasCity
            );

            cellCityRating.push(
                hasCity
                    ? result.cityRating || 1
                    : 0
            );
        }


        cellTypes.push(type);
    }


 
    if (settings.doGrid) {

        addGlobalGrid(
            canvas,
            cols,
            rows
        );

        addCellStats(
            canvas,
            cols,
            rows,
            cellTypes,
            cellHasCity,
            cellCityRating
        );
    }




    const scale =
        settings.scale || 100;

    master.setAttribute(
        "transform",
        `scale(${scale / 100})`
    );


   

    try {

        localStorage.setItem(
            "customBoardSVG",
            canvas.outerHTML
        );

    } catch (error) {

        console.warn(
            "Could not save SVG to localStorage:",
            error
        );
    }
}



function downloadCurrentBoard(
    canvas,
    filename = "Starjourn-Star-Chart.svg"
) {

    if (!canvas) {
        return;
    }

    const svg = canvas.cloneNode(true);

    const BORDER = 20;
    const TEXT_DROP = 20;

    svg.setAttribute("xmlns", SVG_NS);
    svg.setAttribute("version", "1.1");
    svg.setAttribute("baseProfile", "full");

    let viewBox = svg.getAttribute("viewBox");

    if (!viewBox) {

        const width =
            parseFloat(svg.getAttribute("width")) || 1000;

        const height =
            parseFloat(svg.getAttribute("height")) || 1000;

        viewBox = `0 0 ${width} ${height}`;

        svg.setAttribute("viewBox", viewBox);
    }

    const vb = viewBox
        .trim()
        .split(/[\s,]+/)
        .map(Number);

    const vbX = vb[0];
    const vbY = vb[1];
    const vbWidth = vb[2];
    const vbHeight = vb[3];
    const exportX = vbX - BORDER;
    const exportY = vbY - BORDER;
    const exportWidth = vbWidth + BORDER * 2;
    const exportHeight = vbHeight + BORDER * 2;

    svg.setAttribute(
        "viewBox",
        `${exportX} ${exportY} ${exportWidth} ${exportHeight}`
    );

    svg.setAttribute(
        "width",
        exportWidth
    );

    svg.setAttribute(
        "height",
        exportHeight
    );

    // blk bg expanded
    const bg = document.createElementNS(
        SVG_NS,
        "rect"
    );

    bg.setAttribute("x", exportX);
    bg.setAttribute("y", exportY);
    bg.setAttribute("width", exportWidth);
    bg.setAttribute("height", exportHeight);
    bg.setAttribute("fill", "#000000");

    svg.insertBefore(
        bg,
        svg.firstChild
    );

    // 20px text drop
    const textElements =
        svg.querySelectorAll("text");

    textElements.forEach(text => {

        const currentTransform =
            text.getAttribute("transform");

        if (currentTransform) {

            text.setAttribute(
                "transform",
                `${currentTransform} translate(0 ${TEXT_DROP})`
            );

        } else {

            text.setAttribute(
                "transform",
                `translate(0 ${TEXT_DROP})`
            );
        }
    });

    
    const data =
        new XMLSerializer()
            .serializeToString(svg);

    const finalData =
        '<?xml version="1.0" encoding="UTF-8"?>\n' +
        data;

    const blob =
        new Blob(
            [finalData],
            {
                type:
                    "image/svg+xml;charset=utf-8"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    link.href = url;
    link.download = filename;

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    setTimeout(
        () => {
            URL.revokeObjectURL(url);
        },
        1000
    );
}
